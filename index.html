<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanças Kauã</title>
  <meta name="theme-color" content="#03050b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
  <div class="grain"></div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg>
        </div>
        <div><small>Finanças</small><b id="brandName">Kauã</b></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="eyeBtn" data-action="toggle-hide" aria-label="Esconder valores"></button>
        <button class="icon-btn" id="gearBtn" data-action="settings" aria-label="Ajustes"></button>
      </div>
    </header>
    <div class="month" id="month"></div>
    <main id="view"></main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
  <div id="sheet-root"></div>
  <div id="toast"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
